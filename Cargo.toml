[package]
name = "selective-proxy"
version = "0.1.0"
edition = "2024"
description = "Linux selective transparent HTTP/HTTPS proxy PoC"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tokio = { version = "1", features = ["full"] }
url = "2"

[profile.release]
lto = true
strip = true
